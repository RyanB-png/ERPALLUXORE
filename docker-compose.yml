services:

  db:
    image: postgres:17
    container_name: sistema_alluxore_db

    env_file:
      - .env

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend

    container_name: sistema_alluxore_backend

    ports:
      - "8000:8000"

    volumes:
      - ./backend/src:/app

    env_file:
      - .env

    depends_on:
      - db

  frontend:
    build:
      context: ./frontend

    container_name: sistema_alluxore_frontend

    ports:
      - "5173:5173"

    volumes:
      - ./frontend/app:/app

    depends_on:
      - backend

volumes:
  postgres_data: